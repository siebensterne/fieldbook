name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  added-line-style:
    name: Added-line Rust style and tool isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Rust style self-tests
        run: python3 scripts/check_rust_style.py --self-test
      - name: Rust style on added lines
        env:
          CHALLENGE_STYLE_BASE: origin/main
        run: python3 scripts/check_rust_style.py
      - name: Tool isolation
        run: python3 scripts/check_no_cross_pollution.py
      - name: Git policy
        if: github.event_name == 'push'
        run: python3 scripts/check_git_policy.py
      - name: q / kdb+ style on added lines
        env:
          # PRs diff against the PR base commit; other events use a resolvable
          # commit. Branch names and the all-zero "before" SHA are never used.
          Q_STYLE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.sha) }}
        run: |
          python3 scripts/check_q_style.py --self-test
          python3 scripts/check_q_style.py

  rust:
    name: Format, lint, test, release build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      Q_STYLE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.sha) }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned style tools
        run: python3 -m pip install -r requirements-dev.txt

      - name: Python, shell, Makefile and JSON style
        run: cargo xtask style

      - name: Check formatting
        run: cargo xtask fmt

      - name: Lint
        run: cargo xtask lint

      - name: Test
        run: cargo xtask test

      - name: Documentation
        run: cargo xtask docs

      - name: Requirement matrix and architecture gates
        run: cargo xtask verify

      - name: Test journal on an isolated ext4 filesystem (ENOSPC)
        run: scripts/verify-journal-enospc.sh

      - name: End-to-end suites
        run: cargo xtask e2e

      - name: Build release binary
        run: cargo build --release --locked
