name: Authorized live market-data integration

on:
  workflow_dispatch:

permissions:
  contents: read

# Retired under RRP-002 (owner directive D11): the venue live integration
# tests and the venue-specific evidence script were synthetic market-data
# assets and are no longer in the tree. No provider contact, credential or
# synthetic fixture is authorised by this workflow. It is retained as a
# fail-closed placeholder so no stale live-runner configuration remains
# active.
jobs:
  retired:
    name: Live integration retired under D11
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm no live venue test targets remain
        shell: bash
        run: |
          set -euo pipefail
          if ls tests/live_*.rs >/dev/null 2>&1; then
            echo "live venue test targets must not exist under D11" >&2
            exit 1
          fi
          echo "live venue market-data tests retired; no provider action"
