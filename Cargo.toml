[workspace]
members = ["xtask"]
exclude = ["tools/sbe-gen"]
resolver = "2"

[package]
name = "fieldbook"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
build = "src/util/build.rs"
description = "Read-only multi-venue market-data collector with SBE capture and raw-frame journaling"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde", "std"] }
clap = { version = "4.5", features = ["derive"] }
crossbeam = "0.8"
ed25519-dalek = { version = "3.0", features = ["pkcs8", "pem", "rand_core"] }
flate2 = "1"
futures-util = "0.3"
http = "1"
postgres = "0.19"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "http2", "socks"] }
rsa = { version = "0.9.8", features = ["sha2", "pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net", "io-util", "io-std"] }
tokio-socks = "0.5.3"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"

[dev-dependencies]
tempfile = "3"

# Standalone numeric-model benchmark; runs on stable Rust and prints timings.
[[bench]]
name = "numeric_model"
harness = false

[[bench]]
name = "journal_reader"
harness = false

[[bench]]
name = "codec_normalization"
harness = false

[[bench]]
name = "pipeline_stages"
harness = false

# Debug information is only needed for workspace frames. Dependencies never
# need DWARF here, and line tables keep backtraces usable for workspace code.
# This cuts both compile time and the size of the target directory.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = 0

# Thin LTO keeps cross-crate optimisation; multiple codegen units let rustc
# use all available cores instead of serialising the whole crate.
[profile.release]
lto = "thin"
codegen-units = 8
panic = "abort"

# Build scripts and proc macros only run at build time. Optimising them adds
# cost to every clean build without changing the shipped binary.
[profile.release.build-override]
opt-level = 0
codegen-units = 8
debug = 0

[lints.rust]
# The generated SBE codec contains internal unsafe pointer reads. It is an
# isolated, build-generated module with its own `allow(unsafe_code)`; all
# hand-written project code is still denied.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
# Kernel Rust guideline: prefer `expect` over `allow`, because an `expect`
# fails to compile once the lint no longer fires. Both lints are mechanical
# enforcement of a rule that would otherwise depend on reviewer memory.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Rust coding guidelines: safety and documentation are enforced, not advisory.
undocumented_unsafe_blocks = "deny"
doc_markdown = "deny"
manual_assert = "deny"
missing_panics_doc = "deny"
items_after_test_module = "deny"
wildcard_imports = "deny"
redundant_else = "deny"
needless_raw_string_hashes = "deny"
